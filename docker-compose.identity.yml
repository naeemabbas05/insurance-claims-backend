services:
  claims-identity:
    image: quay.io/keycloak/keycloak:26.8.2
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin-change-me
    ports:
      - "8081:8080"
    volumes:
      - ./dev/keycloak/claims-demo-realm.json:/opt/keycloak/data/import/claims-demo-realm.json:ro
